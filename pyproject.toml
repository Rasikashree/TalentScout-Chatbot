[project]
name = "talentscout-chatbot"
version = "1.0.0"
description = "TalentScout - AI Hiring Assistant"
authors = [{name = "TalentScout Team"}]
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.streamlit]
client.showErrorDetails = true
logger.level = "info"
